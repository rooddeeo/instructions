<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інструкція UkrJobs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            padding: 15px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .accent { color: var(--tg-theme-button-color, #2481cc); }
    </style>
</head>
<body>
    <h2>📖 Інструкція для Роботодавців</h2>
    <p>Вітаємо! Цей бот допоможе вам швидко опублікувати вакансію в каналі <span class="accent"><b>UkrJobs</b></span>.</p>
    
    <div class="card">
        <h3>1. Заповнення полів</h3>
        <p>● <b>Назва вакансії:</b> Пишіть чітко (наприклад: <i>Водій категорії С</i>).</p>
        <p>● <b>Зв'язок:</b> Можна додати максимум по 2 контакти кожного типу.</p>
    </div>

    <script>
        // Информируем Telegram, что приложение готово к отображению
        window.Telegram.WebApp.ready();
        // Можно зафиксировать высоту, чтобы окно не прыгало
        window.Telegram.WebApp.expand(); 
    </script>
</body>
</html>
